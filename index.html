/* ------------------------------------------------------------- charts (SVG) */
var PALETTE = ['#2557e6', '#7c5cff', '#f5a524', '#0fbf94', '#f2436b', '#0bb6d6', '#66758e', '#8b5cf6'];
function chartColors() {
  var dark = S.theme === 'dark';
  return { grid: dark ? '#1a2740' : '#e9eff8', text: dark ? '#8194b0' : '#66758e', line: dark ? '#243453' : '#e4ebf5' };
}
function lineChart(data, opts) {
  opts = opts || {};
  var w = 640, h = opts.height || 240, pad = { l: 46, r: 12, t: 14, b: 26 };
  var vals = data.values || [], labels = data.labels || [];
  var max = Math.max.apply(null, vals.concat([1]));
  var c = chartColors();
  var innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
  var stepX = vals.length > 1 ? innerW / (vals.length - 1) : innerW;
  var pts = vals.map(function (v, i) { return [pad.l + i * stepX, pad.t + innerH - (v / max) * innerH]; });
  function smooth(p) {
    if (p.length < 2) return '';
    var d = 'M' + p[0][0] + ',' + p[0][1];
    for (var i = 0; i < p.length - 1; i++) {
      var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + p2[0] + ',' + p2[1];
    }
    return d;
  }
  var path = smooth(pts);
  var area = path + ' L' + (pts.length ? pts[pts.length - 1][0] : pad.l) + ',' + (pad.t + innerH) + ' L' + pad.l + ',' + (pad.t + innerH) + ' Z';
  var gid = 'g' + uid();
  var gridLines = '';
  for (var i = 0; i <= 4; i++) {
    var y = pad.t + innerH - (i / 4) * innerH;
    gridLines += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="' + c.grid + '" stroke-width="1"/>';
    gridLines += '<text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" fill="' + c.text + '" font-size="9.5" font-weight="600">' + rpShort((max / 4) * i) + '</text>';
  }
  var xLabels = '';
  var every = Math.ceil(labels.length / 7);
  labels.forEach(function (l, i) {
    if (i % every !== 0 && i !== labels.length - 1) return;
    xLabels += '<text x="' + (pad.l + i * stepX) + '" y="' + (h - 8) + '" text-anchor="middle" fill="' + c.text + '" font-size="9.5" font-weight="600">' + esc(l) + '</text>';
  });
  var dots = pts.map(function (p, i) {
    return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.4" fill="#fff" stroke="' + (opts.color || PALETTE[0]) + '" stroke-width="2.2">' +
      '<title>' + esc(labels[i] || '') + ': ' + rp(vals[i]) + '</title></circle>';
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img" aria-label="Grafik garis ' + esc(opts.label || 'data') + '" preserveAspectRatio="none" style="overflow:visible">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + (opts.color || PALETTE[0]) + '" stop-opacity=".28"/>' +
    '<stop offset="100%" stop-color="' + (opts.color || PALETTE[0]) + '" stop-opacity="0"/></linearGradient></defs>' +
    gridLines + '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + path + '" fill="none" stroke="' + (opts.color || PALETTE[0]) + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="chart-line" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:draw 1.4s var(--ease) forwards"/>' +
    dots + xLabels + '</svg>' +
    '<style>@keyframes draw{to{stroke-dashoffset:0}}</style>';
}
function barChart(data, opts) {
  opts = opts || {};
  var vals = data.values || [], labels = data.labels || [];
  var max = Math.max.apply(null, vals.concat([1]));
  if (opts.horizontal) {

        '<div class="progress-line"><i style="width:' + Math.max(3, vals[i] / max * 100) + '%;background:' + PALETTE[i % PALETTE.length] + '"></i></div></div>';
    }).join('') + '</div>';

  var c = chartColors();

    return '<rect x="' + x + '" y="' + (pad.t + innerH) + '" width="' + width + '" height="0" rx="5" fill="' + (opts.color || PALETTE[1]) + '" opacity="' + (v ? .92 : .25) + '">' +
      '<title>' + esc(labels[i] || '') + ': ' + (opts.money ? rp(v) : v) + '</title>' +
      '<animate attributeName="y" to="' + y + '" dur="0.7s" begin="' + (i * 0.04) + 's" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1" keyTimes="0;1"/>' +
      '<animate attributeName="height" to="' + bh + '" dur="0.7s" begin="' + (i * 0.04) + 's" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1" keyTimes="0;1"/></rect>' +
      '<text x="' + (x + width / 2) + '" y="' + (h - 8) + '" text-anchor="middle" fill="' + c.text + '" font-size="9.5" font-weight="600">' + esc(labels[i] || '') + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img" aria-label="Grafik batang" preserveAspectRatio="none">' +
    '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + (pad.t + innerH) + '" y2="' + (pad.t + innerH) + '" stroke="' + c.grid + '"/>' + bars + '</svg>';
}
function donutChart(data, opts) {
  opts = opts || {};
  var vals = data.values || [], labels = data.labels || [];
  var total = vals.reduce(function (a, b) { return a + b; }, 0);
  var R = 62, r = 44, cx = 80, cy = 80;
  if (!total) return '<div class="chart-empty">' + I('pie-chart') + '<span>Belum ada data</span></div>';
  var start = -Math.PI / 2, segs = '';
  vals.forEach(function (v, i) {
    var ang = (v / total) * Math.PI * 2;
    var end = start + ang;
    var large = ang > Math.PI ? 1 : 0;
    var x1 = cx + R * Math.cos(start), y1 = cy + R * Math.sin(start);
    var x2 = cx + R * Math.cos(end), y2 = cy + R * Math.sin(end);
    var x3 = cx + r * Math.cos(end), y3 = cy + r * Math.sin(end);
    var x4 = cx + r * Math.cos(start), y4 = cy + r * Math.sin(start);
    segs += '<path d="M' + x1 + ',' + y1 + ' A' + R + ',' + R + ' 0 ' + large + ' 1 ' + x2 + ',' + y2 +
      ' L' + x3 + ',' + y3 + ' A' + r + ',' + r + ' 0 ' + large + ' 0 ' + x4 + ',' + y4 + ' Z" fill="' + PALETTE[i % PALETTE.length] + '" opacity=".94">' +
      '<title>' + esc(labels[i]) + ': ' + (opts.money ? rp(v) : v) + ' (' + Math.round(v / total * 100) + '%)</title></path>';
    start = end;
  });
  return '<div class="row" style="gap:18px;align-items:center;flex-wrap:wrap">' +
    '<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Diagram donat">' + segs +
    '<text x="80" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="' + chartColors().text + '">TOTAL</text>' +
    '<text x="80" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="' + (S.theme === 'dark' ? '#eaf0fb' : '#101828') + '">' + (opts.money ? rpShort(total) : total) + '</text></svg>' +
    '<div class="chart-legend" style="flex-direction:column;gap:7px;margin:0">' + labels.map(function (l, i) {
      return '<span><i style="background:' + PALETTE[i % PALETTE.length] + '"></i>' + esc(l) + ' <b style="margin-left:4px">' + Math.round(vals[i] / total * 100) + '%</b></span>';
    }).join('') + '</div></div>';
}
function sparkline(values, color) {
  var max = Math.max.apply(null, values.concat([1]));
  return '<div class="spark">' + values.map(function (v) {
    return '<i style="height:' + Math.max(8, v / max * 100) + '%;' + (color ? 'background:' + color : '') + '" title="' + rp(v) + '"></i>';
  }).join('') + '</div>';
}

/* ---------------------------------------------------------------- scroll spy & nav */
var spyObserver = null;
function bindScrollSpy() {
  var nav = $('#nav');
  var onScroll = function () {
    if (nav) nav.classList.toggle('scrolled', window.scrollY > 8);
    var top = $('#fab-top');
    if (top) top.classList.toggle('show', window.scrollY > 600);
  };
  window.removeEventListener('scroll', window.__nxScroll || function () { });
  window.__nxScroll = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  if (!('IntersectionObserver' in window)) return;
  if (spyObserver) spyObserver.disconnect();
  spyObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var id = en.target.id;
      $$('[data-spy]').forEach(function (a) { a.classList.toggle('active', a.dataset.spy === id); });
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  ['katalog', 'paket', 'layanan', 'tukar-tambah', 'testimoni', 'faq'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) spyObserver.observe(el);
  });
}

    var btn = m.el.querySelector('#co-submit');

      setTimeout(function () { successOrderModal(r); }, 240);

  },
  'focus-search': function () {
    var q = $('#katalog-q');
    if (q) { q.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(function () { q.focus(); }, 320); }
  },
  cat: function (el) {
    S.filters.kategori = el.dataset.cat;
    $$('.pill-tab').forEach(function (t) { t.setAttribute('aria-selected', t === el); });
    loadCatalog(false).catch(function (e) { toast(e.message, 'bad'); });
  },
  filter: function () { openFilterModal(); },
  'clear-q': function () { S.filters.q = ''; var q = $('#katalog-q'); if (q) q.value = ''; loadCatalog(false); },
  'clear-filter': function (el) {
    var k = el.dataset.key;
    if (k === 'all' || k === 'q') { S.filters.q = ''; var q = $('#katalog-q'); if (q) q.value = ''; }
    if (k === 'all' || k === 'kondisi') S.filters.kondisi = '';
    if (k === 'all' || k === 'diskon') S.filters.diskon = false;
    if (k === 'all' || k === 'tersedia') S.filters.tersedia = false;
    if (k === 'all' || k === 'kategori') {
      S.filters.kategori = 'Semua';
      $$('.pill-tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.cat === 'Semua'); });
    }
    loadCatalog(false).catch(function (e) { toast(e.message, 'bad'); });
  },
  'load-more': function (el) {
    el.disabled = true; el.innerHTML = '<span class="spin"></span>Memuat…';
    loadCatalog(true).catch(function (e) { toast(e.message, 'bad'); el.disabled = false; });
  },
  detail: function (el, e) { if (e) e.preventDefault(); openProduct(el.dataset.sku); },

    var p = null; (S.catalog || []).forEach(function (x) { if (x.sku === el.dataset.sku) p = x; });

    '<p class="tiny muted" style="line-height:1.7">' + (CONFIG.API_URL ? 'Lupa PIN? Minta Owner melakukan reset melalui menu Staf.' : 'PIN demo — Owner 1234 · Admin 2345 · Kasir 3456 · Gudang 4567 · Teknisi 5678 · Marketing 6789') + '</p>' +
    '<a class="link-arrow" href="#/" style="margin-top:12px">' + I('arrow-left') + 'Kembali ke toko</a>' +
    '</div></div></div>';
  var pin = '';
  var dots = $$('#pin-dots .pin-dot');
  function paint() {
    dots.forEach(function (d, i) {
      d.textContent = pin[i] ? '•' : '';
      d.classList.toggle('filled', !!pin[i]);
      d.classList.toggle('active', i === pin.length);
    });
  }
  paint();
  function submit() {
    if (pin.length < 4) { toast('PIN harus 4 digit', 'warn'); return; }
    doLogin(pin);
  }
  $$('[data-pin]').forEach(function (b) {
    b.onclick = function () {
      var v = b.dataset.pin;
      if (v === 'clear') { pin = ''; paint(); return; }
      if (v === 'submit') { submit(); return; }
      if (pin.length < 4) { pin += v; paint(); if (pin.length === 4) setTimeout(submit, 160); }
    };
  });
  document.addEventListener('keydown', function handler(e) {
    if (!document.getElementById('pin-dots')) { document.removeEventListener('keydown', handler); return; }
    if (/^[0-9]$/.test(e.key) && pin.length < 4) { pin += e.key; paint(); if (pin.length === 4) setTimeout(submit, 140); }
    else if (e.key === 'Backspace') { pin = pin.slice(0, -1); paint(); }
    else if (e.key === 'Enter') { submit(); }
  });
  $('#login-form').onsubmit = function (e) { e.preventDefault(); submit(); };

async function doLogin(pin) {
  var btn = $('#login-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Memverifikasi…'; }
  try {
    var r = await api('auth.login', { pin: pin }, { noAuthReset: true });
    S.token = r.token; S.user = r.user; S.features = r.features || {};
    if (r.settings) S.settings = Object.assign({}, S.settings, r.settings);
    store.set('token', r.token); store.set('user', r.user);
    toast('Selamat datang, ' + r.user.nama, 'ok');
    var pages = visiblePages();
    var target = pages.indexOf(S.admin.page) >= 0 ? S.admin.page : pages[0] || 'dashboard';
    go('#/admin/' + target);
  } catch (e) {
    toast(e.message, 'bad', 5000);
    var dots = $$('#pin-dots .pin-dot');
    dots.forEach(function (d) { d.classList.add('animate'); });
    setTimeout(function () { location.hash = '#/admin'; renderLogin(e.message); }, 100);
  }
}
function logout() {
  S.token = ''; S.user = null; S.features = {};

}

function posShortcuts(e) {
  if (S.admin.page !== 'pos' || MODALS.length) return;
  if (e.key === 'F2') { e.preventDefault(); var q = $('#pos-q'); if (q) q.focus(); }

  if (e.key === 'Escape' && POS.items.length) { POS.items = []; renderPOSCart(); }
}
function posFiltered() {
  var q = String(POS.q).toLowerCase();
  return (POS.catalog || []).filter(function (p) {
    if (POS.cat !== 'Semua' && p.kategori !== POS.cat) return false;
    if (q && (p.nama + ' ' + p.sku + ' ' + (p.brand || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).slice(0, 60);
}
function renderPOSGrid() { filterPOSGrid(); }
function filterPOSGrid() {
  var grid = $('#pos-grid');
  if (!grid) return;
  var items = posFiltered();
  $('#pos-count').textContent = items.length + ' produk';
  if (!items.length) { grid.innerHTML = emptyHTML('search', 'Produk tidak ditemukan', 'Coba kata kunci lain.'); return; }
  grid.innerHTML = items.map(function (p) {
    return '<button class="card" style="text-align:left;padding:0;overflow:hidden;cursor:pointer" data-padd="' + attr(p.sku) + '" ' + (p.stok <= 0 ? 'disabled style="opacity:.5"' : '') + '>' +
      '<img src="' + attr(imgSrc(p.gambar)) + '" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover">' +
      '<div style="padding:9px"><div class="tiny" style="font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em">' + esc(p.nama) + '</div>' +
      '<div class="row-between" style="margin-top:5px"><strong style="font-size:12.5px">' + rp(p.harga) + '</strong>' +
      '<span class="chip ' + (p.stok > 5 ? 'ok' : p.stok > 0 ? 'warn' : 'bad') + '" style="font-size:10px">' + p.stok + '</span></div></div></button>';
  }).join('');
  grid.onclick = function (e) {
    var b = e.target.closest('[data-padd]'); if (!b) return;
    posAdd(b.dataset.padd);
  };
}
function posAdd(sku) {
  var p = null; (POS.catalog || []).forEach(function (x) { if (x.sku === sku) p = x; });
  if (!p) return;
  var hit = POS.items.filter(function (i) { return i.sku === sku; })[0];
  if (hit) {
    if (hit.qty + 1 > p.stok) { toast('Stok tersisa ' + p.stok, 'warn'); return; }
    hit.qty++;
  } else {
    if (p.stok <= 0) { toast('Stok habis', 'warn'); return; }
    POS.items.push({ sku: p.sku, nama: p.nama, harga: p.harga, qty: 1, gambar: p.gambar, stok: p.stok });
  }
  renderPOSCart();
}
function posTotals() {
  var sub = POS.items.reduce(function (a, i) { return a + i.harga * i.qty; }, 0);
  var diskon = Math.min(sub, num(POS.diskon) + num(POS.promoDiskon));
  var total = Math.max(0, sub - diskon);
  var bayar = num(String(POS.bayar || '').replace(/\./g, '')) || total;
  return { sub: sub, diskon: diskon, total: total, bayar: bayar, kembali: Math.max(0, bayar - total) };
}
function renderPOSCart() {

      return '<div class="row" style="gap:9px;padding:8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)">' +

        '<div style="flex:1;min-width:0"><div class="tiny" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(it.nama) + '</div>' +

        '<div class="qty qty-sm"><button data-pminus="' + i + '" aria-label="Kurangi">' + I('minus') + '</button>' +
        '<input value="' + it.qty + '" readonly aria-label="Jumlah">' +
        '<button data-pplus="' + i + '" aria-label="Tambah">' + I('plus') + '</button></div>' +
        '<button class="modal-close" style="width:26px;height:26px" data-pdel="' + i + '" aria-label="Hapus">' + I('x') + '</button></div>';
    }).join('') + '</div>';
    box.onclick = function (e) {
      var mi = e.target.closest('[data-pminus]'), pl = e.target.closest('[data-pplus]'), dl = e.target.closest('[data-pdel]');
      if (mi) { var i = int(mi.dataset.pminus); POS.items[i].qty = Math.max(1, POS.items[i].qty - 1); renderPOSCart(); }
      if (pl) { var j = int(pl.dataset.pplus); var it = POS.items[j]; if (it.qty + 1 > (it.stok || 99)) { toast('Stok tersisa ' + it.stok, 'warn'); } else { it.qty++; renderPOSCart(); } }
      if (dl) { POS.items.splice(int(dl.dataset.pdel), 1); renderPOSCart(); }
    };
  }
  var t = posTotals();
  var box2 = $('#pos-totals');
  if (box2) {
    box2.innerHTML = '<div class="totals"><div class="r"><span class="muted">Subtotal (' + POS.items.reduce(function (a, i) { return a + i.qty; }, 0) + ' item)</span><strong>' + rp(t.sub) + '</strong></div>' +
      (t.diskon ? '<div class="r"><span class="muted">Diskon' + (POS.promo ? ' (' + esc(POS.promo) + ')' : '') + '</span><strong style="color:var(--mint)">-' + rp(t.diskon) + '</strong></div>' : '') +
      '<div class="r total"><span>Total</span><strong>' + rp(t.total) + '</strong></div></div>' +
      '<div class="field" style="margin-top:10px"><label for="pos-bayar">Uang diterima</label>' +
      '<input class="input input-sm" id="pos-bayar" data-money inputmode="numeric" placeholder="' + thousands(t.total) + '" value="' + (POS.bayar || '') + '"></div>' +
      '<div class="row" style="gap:5px;margin-top:6px;flex-wrap:wrap">' +
      [t.total, 50000, 100000, 200000].filter(function (v, i, a) { return a.indexOf(v) === i && v > 0; }).map(function (v) {
        return '<button class="btn btn-ghost btn-xs" data-cash="' + v + '">' + rpShort(v) + '</button>';
      }).join('') + '</div>' +
      '<div class="row-between" style="margin-top:10px"><span class="tiny muted">Kembalian</span><strong style="color:var(--mint)">' + rp(t.kembali) + '</strong></div>';
    var bayar = box2.querySelector('#pos-bayar');

    fmtNumInputs(box2);
    box2.addEventListener('click', function (e) {

Object.assign(ACTIONS, {
  'pos-clear': function () {
    if (!POS.items.length) return;
    confirmDialog({ title: 'Kosongkan keranjang?', message: 'Semua item akan dihapus dari keranjang kasir.', danger: true, confirmText: 'Kosongkan' })
      .then(function (ok) { if (ok) { POS.items = []; POS.promo = ''; POS.promoDiskon = 0; POS.diskon = 0; renderPOSCart(); } });
  },

    if (!kode) { POS.promo = ''; POS.promoDiskon = 0; renderPOSCart(); return; }

  },
  'pos-pay': function () { posPay(); }
});
async function posPay() {
  if (!POS.items.length) { toast('Keranjang masih kosong', 'warn'); return; }
  var t = posTotals();
  var btn = $('#pos-pay-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Memproses…'; }
  try {
    var r = await api('pos.checkout', {
      items: POS.items.map(function (i) { return { sku: i.sku, qty: i.qty }; }),
      metode: POS.metode, bayar: t.bayar, nama: POS.nama || 'Pelanggan Umum', wa: POS.wa,
      promo: POS.promo || undefined, diskon_manual: POS.diskon
    });
    POS.last = r;
    POS.items = []; POS.promo = ''; POS.promoDiskon = 0; POS.diskon = 0; POS.bayar = '';
    toast('Transaksi ' + r.order.id + ' berhasil', 'ok');
    posReceiptModal(r);
    renderPage('pos');
  } catch (e) {
    toast(e.message, 'bad', 6000);
    if (btn) { btn.disabled = false; btn.innerHTML = I('check-circle') + 'Bayar (F9)'; }
  }
}

async function handleMediaFiles(files) {

    catch (e) { toast(files[i].name + ': ' + e.message, 'bad'); }
  }
  toast('Unggahan selesai', 'ok');
  renderPage('media');
}

function bindKanban() {
  var dragId = null;
  $$('.kcard').forEach(function (c) {
    c.addEventListener('dragstart', function (e) { dragId = c.dataset.svc; e.dataTransfer.setData('text/plain', dragId); c.style.opacity = '.5'; });
    c.addEventListener('dragend', function () { c.style.opacity = ''; });
    c.addEventListener('click', function () { ACTIONS['svc-edit']({ dataset: { id: dragId || c.dataset.svc } }); });
  });
  $$('[data-drop]').forEach(function (zone) {
    zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.style.background = 'var(--brand-50)'; });
    zone.addEventListener('dragleave', function () { zone.style.background = ''; });
    zone.addEventListener('drop', async function (e) {
      e.preventDefault(); zone.style.background = '';
      var id = e.dataTransfer.getData('text/plain');
      var status = zone.dataset.drop;
      if (!id) return;
      try { await api('service.status', { id: id, status: status }); toast('Status ' + id + ' → ' + status.replace('_', ' '), 'ok'); renderPage('service'); }
      catch (err) { toast(err.message, 'bad'); }
    });
  });
}

  },
  'sys-reset': async function () {
    var v = await promptDialog({ title: 'Kosongkan data', label: 'Ketik RESET untuk konfirmasi', required: true, confirmText: 'Lanjutkan', hint: 'Aksi ini tidak dapat dibatalkan.' });
    if (v !== 'RESET') { if (v !== null) toast('Konfirmasi tidak cocok', 'warn'); return; }
    try { await api('system.reset', { konfirmasi: 'RESET' }); await loadBootstrap(true); toast('Data dikosongkan', 'ok'); renderPage('sistem'); }
    catch (e) { toast(e.message, 'bad'); }
  }
});
/* ============================================================================
   NEXALAP · BOOT & ROUTER
   state bootstrap · hash routing · global action dispatcher · data-act binding
   ========================================================================= */
var ROUTES_PUBLIC = { '': 1, '/': 1, 'home': 1 };

/* --------------------------------------------------------- bootstrap state */
async function loadBootstrap(force) {
  if (S.loaded && !force) return;
  if (S._bootPromise && !force) return S._bootPromise;
  S._bootPromise = (async function () {
    try {
      var b = await api('public.bootstrap');
      S.settings = Object.assign({}, S.settings, b.settings || {});
      S.features = Object.assign({}, S.features, b.features || {});
      S.categories = b.categories || S.categories;
      S.banners = b.banners || [];
      S.testimonials = b.testimonials || [];
      S.stats = b.stats || {};
      S.faq = b.faq || [];
      S.catalog = b.products || [];
      S.loaded = true;
    } catch (e) {
      /* storefront tetap tampil dengan nilai default */
      S.loaded = true;
      toast('Gagal memuat data toko: ' + e.message, 'warn', 6000);
    }
    if (S.token) {
      try {
        var me = await api('auth.me');
        S.user = me.user;
        S.features = Object.assign({}, S.features, me.features || {});
        S.settings = Object.assign({}, S.settings, me.settings || {});
      } catch (e) {
        S.token = ''; S.user = null;
        store.del('token'); store.del('user');
      }
    }
    applyTheme(S.theme);
    return true;
  })();
  return S._bootPromise;
}

/* --------------------------------------------------------- hash routing */
function parseHash() {
  var h = String(location.hash || '').replace(/^#/, '');
  if (h.indexOf('/admin') === 0) {
    var rest = h.slice(7).replace(/^\//, '');
    return { view: 'admin', page: rest || 'dashboard' };
  }
  if (h.indexOf('/p/') === 0) {
    return { view: 'store', page: 'home', product: decodeURIComponent(h.slice(3)) };
  }
  return { view: 'store', page: 'home', anchor: h };
}

function go(hash) {
  if (location.hash === hash) { renderRoute(); return; }
  location.hash = hash;
}

var _lastView = '';
async function renderRoute() {
  var r = parseHash();
  S.route = r;
  closeDrawers();
  if (r.view === 'admin') {
    S.admin.page = r.page;
    document.body.classList.remove('has-bottom-nav');
    if (!S.token || !S.user) { renderLogin(); _lastView = 'admin'; return; }
    if (!S.loaded) {
      $('#app').innerHTML = '<div class="admin"><div class="admin-body" style="padding:60px 20px">' + skeletonRows(4) + '</div></div>';
      await loadBootstrap();
    }
    document.title = 'Admin · ' + (S.settings.toko_nama || CONFIG.BRAND);
    renderAdmin();
    window.scrollTo({ top: 0, behavior: 'auto' });
    _lastView = 'admin';
    return;
  }
  if (!S.loaded) {
    $('#app').innerHTML = '<div class="boot"><div class="boot-mark">' + I('laptop') + '</div><div class="boot-bar"><i></i></div></div>';
    await loadBootstrap();
  }
  document.title = (S.settings.toko_nama || CONFIG.BRAND) + ' — ' + (S.settings.toko_tagline || 'Laptop & PC Store');
  if (_lastView !== 'store') {
    renderStore();
    if (_lastView === 'admin' && r.anchor) {
      setTimeout(function () {
        var el = document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
      }, 60);
    }
  } else if (r.anchor) {
    var el2 = document.getElementById(r.anchor);
    if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  if (r.product && !document.querySelector('#modal-root .modal')) {
    setTimeout(function () { openProduct(r.product); }, 220);
  }
  _lastView = 'store';
}

/* --------------------------------------------------------- click delegation */
function bindGlobalActions() {
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented) return;
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var name = el.dataset.act;
    var fn = ACTIONS[name];
    if (!fn) return;
    if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
    if (el.disabled) return;
    try {
      var res = fn(el, e);
      if (res && typeof res.catch === 'function') res.catch(function (err) { toast(err.message || 'Terjadi kesalahan', 'bad'); });
    } catch (err) {
      toast(err.message || 'Terjadi kesalahan', 'bad');
    }
  });
  /* tombol kembali / maju browser */
  window.addEventListener('hashchange', function () { renderRoute(); });
  /* Esc menutup drawer */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeDrawers();
      var s = $('#side');
      if (s) s.classList.remove('open');
    }
  });
  /* tema mengikuti preferensi sistem saat pertama kali */
  if (!store.get('theme', '')) {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq && mq.matches) S.theme = 'dark';
  }
  /* kecepatan: debounce resize untuk toggle tombol sidebar */
  window.addEventListener('resize', debounce(function () {
    var tg = $('#side-toggle');
    if (tg) tg.style.display = window.innerWidth <= 1024 ? 'grid' : 'none';
    var s = $('#side');
    if (s && window.innerWidth > 1024) s.classList.remove('open');
  }, 200));
}

/* --------------------------------------------------------- boot */
(function boot() {
  applyTheme(S.theme);
  bindGlobalActions();
  if (!location.hash) location.hash = '#/';
  renderRoute();
  /* segarkan data storefront saat tab kembali aktif */
  var lastFocus = Date.now();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - lastFocus > 60000 && S.route.view === 'store') {
      loadBootstrap(true).then(function () { if (S.route.view === 'store') renderStore(); });
    }
    lastFocus = Date.now();
  });
})();

</script>
